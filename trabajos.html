<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trabajos — Benja Visuals</title>

  <meta
    name="description"
    content="Portfolio de edición de video, diseño y desarrollo web de Benja Visuals."
  >

  <link rel="stylesheet" href="style.css">

  <style>
    /* ========================================
       PROYECTOS
    ======================================== */

    .projects-section {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 40px;
    }

    .section-title span {
      font-size: 14px;
      opacity: 0.5;
    }

    .section-title h2 {
      margin: 0;
      font-size: 38px;
      font-weight: 700;
    }


    /* ========================================
       GRID
    ======================================== */

    .project-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .project {
      width: 100%;
      min-width: 0;
    }

    .visual {
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: #111;
    }


    /* ========================================
       VIMEO
    ======================================== */

    .reel-visual {
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: #111;
    }

    .vimeo-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      overflow: hidden;
    }

    /*
      Reel 2 tiene formato 4:3 según el embed
      que pasaste de Vimeo.
    */
    .vimeo-wrapper.reel-2 {
      aspect-ratio: 4 / 3;
    }

    .vimeo-wrapper iframe {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
      display: block;
    }


    /* ========================================
       DISEÑOS
    ======================================== */

    .design-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .design-grid img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      object-fit: cover;
    }


    /* ========================================
       YOUTUBE
    ======================================== */

    .youtube-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .youtube-card {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 18px;
      background: #111;
    }

    .youtube-card iframe {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
    }


    /* ========================================
       WEBSITES
    ======================================== */

    .websites-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .website-card {
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: #111;
    }

    .website-card iframe {
      width: 100%;
      height: 500px;
      border: 0;
      display: block;
    }


    /* ========================================
       WHATSAPP
    ======================================== */

    .contact-section {
      text-align: center;
      padding: 100px 24px;
    }

    .contact-section a {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 25px;
      border-radius: 999px;
      text-decoration: none;
    }


    /* ========================================
       TABLET
    ======================================== */

    @media (max-width: 900px) {

      .projects-section {
        padding: 65px 20px;
      }

      .project-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .design-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .youtube-grid {
        grid-template-columns: 1fr;
      }

      .websites-grid {
        grid-template-columns: 1fr;
      }

    }


    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 600px) {

      .projects-section {
        padding: 50px 16px;
      }

      .section-title {
        margin-bottom: 25px;
      }

      .section-title h2 {
        font-size: 30px;
      }


      /* Reels */

      .project-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .reel-card {
        width: 100%;
      }

      .vimeo-wrapper {
        max-width: 430px;
        margin: 0 auto;
      }


      /* Diseños */

      .design-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }


      /* YouTube */

      .youtube-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }


      /* Websites */

      .websites-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .website-card iframe {
        height: 400px;
      }


      /* Contacto */

      .contact-section {
        padding: 70px 20px;
      }

    }


    /* ========================================
       MOBILE PEQUEÑO
    ======================================== */

    @media (max-width: 400px) {

      .projects-section {
        padding-left: 12px;
        padding-right: 12px;
      }

      .section-title h2 {
        font-size: 27px;
      }

    }

  </style>
</head>


<body>


  <!-- ========================================
       HEADER
  ======================================== -->

  <header class="site-header">

    <div class="container">

      <a href="index.html" class="logo">

      </a>

      <button
        class="menu-toggle"
        aria-label="Abrir menú"
        aria-expanded="false"
      >
        ☰
      </button>

      <nav class="main-nav">

        <a href="index.html">

        </a>

        <a href="trabajos.html" class="active">

        </a>

        <a href="index.html#sobre-mi">
          Sobre mí
        </a>

        <a href="index.html#contacto">

        </a>

    </div>

  <main>


    <!-- ========================================

    ======================================== -->

    <section

      <div class="section-title">

        <span>01</span>

        <h2>
          Edición
        </h2>

      </div>


      <div class="project-grid reels-grid">


        <!-- REEL 1 -->

        <article class="project reel-card">

          <div class="visual reel-visual">

            <div class="vimeo-wrapper">

              <iframe
                src="https://player.vimeo.com/video/1227611264?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479"
                frameborder="0"
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
                title="Reel 1"
              ></iframe>

            </div>

          </div>

        </article>



        <!-- REEL 2 -->

        <article class="project reel-card">

          <div class="visual reel-visual">

            <div class="vimeo-wrapper reel-2">

              <iframe
                src="https://player.vimeo.com/video/1227611527?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479"
                frameborder="0"
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
                title="Reel 2"
              ></iframe>

            </div>

          </div>

        </article>



        <!-- REEL 3 -->

        <article class="project reel-card">

          <div class="visual reel-visual">

            <div class="vimeo-wrapper">

              <iframe
                src="https://player.vimeo.com/video/1227611531?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479"
                frameborder="0"
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
                title="Reel 3"
              ></iframe>

            </div>

          </div>

        </article>


      </div>

    </section>



    <!-- ========================================
         YOUTUBE
    ======================================== -->

    <section
      class="projects-section"
      id="youtube"
    >

      <div class="section-title">

        <span>02</span>

        <h2>
          YouTube
        </h2>

      </div>


      <div class="youtube-grid">


        <!-- VIDEO YOUTUBE 1 -->

        <article class="project youtube-card">

          <iframe
            src="https://www.youtube.com/embed/VIDEO_ID_1"

            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>

        </article>


        <!-- VIDEO YOUTUBE 2 -->

        <article class="project youtube-card">

          <iframe
            src="https://www.youtube.com/embed/VIDEO_ID_2"
            title="Video de YouTube"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>

        </article>


      </div>

    </section>



    <!-- ========================================
         DISEÑO
    ======================================== -->

    <section
      class="projects-section"
      id="diseno"
    >

      <div class="section-title">

        <span>03</span>

        <h2>
          Diseño
        </h2>

      </div>


      <div class="design-grid">


        <article class="project">

          <div class="visual">

            <img
              src="assets/projects/diseno/miniatura1.jpg"
              alt="Diseño realizado por Benja Visuals"

          </div>

        </article>


        <article class="project">

          <div class="visual">

            <img
              src="assets/projects/diseno/miniatura2.jpg"
              alt="Diseño realizado por Benja Visuals"
              loading="lazy"
            >

          </div>

        </article>


        <article class="project">

          <div class="visual">

            <img
              src="assets/projects/diseno/miniatura3.jpg"
              alt="Diseño realizado por Benja Visuals"
              loading="lazy"
            >

          </div>

        </article>


      </div>

    </section>



    <!-- ========================================
         WEBSITES
    ======================================== -->

    <section
      class="projects-section"
      id="websites"
    >

      <div class="section-title">

        <span>04</span>

        <h2>
          Websites
        </h2>

      </div>


      <div class="websites-grid">


        <article class="website-card">

          <iframe
            src="https://example.com"
            title="Website"
            loading="lazy"
          ></iframe>

        </article>


        <article class="website-card">

          <iframe
            src="https://example.com"
            title="Website"
            loading="lazy"
          ></iframe>

        </article>


      </div>

    </section>



    <!-- ========================================
         CONTACTO
    ======================================== -->

    <section
      class="contact-section"
      id="contacto"
    >

      <h2>
        ¿Trabajamos juntos?
      </h2>

      <p>
        Si necesitás edición, diseño o una web,
        escribime.
      </p>

      <a
        href="https://wa.me/"

        Hablar por WhatsApp

    </section>


  </main>



  <!-- ========================================
       FOOTER
  ======================================== -->

  <footer>

    <p>
      © <span id="year"></span> Benja Visuals.
      Todos los derechos reservados.
    </p>

  </footer>



  <!-- ========================================
       JAVASCRIPT
  ======================================== -->

  <script>

    /* Año automático */

    const yearElement =
      document.getElementById("year");

    if (yearElement) {
      yearElement.textContent =
        new Date().getFullYear();
    }



    /* Menú mobile */

    const menuToggle =
      document.querySelector(".menu-toggle");

    const mainNav =
      document.querySelector(".main-nav");


    if (menuToggle && mainNav) {

      menuToggle.addEventListener(
        "click",
        () => {

          const isOpen =
            mainNav.classList.toggle("open");

          menuToggle.setAttribute(
            "aria-expanded",
            isOpen
          );

        }
      );


      /* Cerrar menú al tocar un enlace */

      mainNav
        .querySelectorAll("a")
        .forEach(link => {

          link.addEventListener(
            "click",
            () => {

              mainNav.classList.remove("open");

              menuToggle.setAttribute(
                "aria-expanded",
                "false"
              );

            }
          );

        });

    }

  </script>


</body>
</html>
